# Streamlit settings for this app (read when it is started from the project folder).
[server]
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1f4fd1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fb"
textColor = "#1b2430"
linkColor = "#1f4fd1"
baseRadius = "0.6rem"
borderColor = "#e3e7ef"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#f7f9fd"
secondaryBackgroundColor = "#ffffff"
