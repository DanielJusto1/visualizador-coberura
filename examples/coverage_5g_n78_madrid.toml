# 5G NR n78 (3.5 GHz) network in central Madrid: five rooftop sites with three
# sectors each, about 1 km apart. Urban macro model from 3GPP TR 38.901 (terrain not needed in a city:
# the statistical model already accounts for buildings).
band = "n78"
tx_power = 49.0        # dBm per sector
tx_gain = 17.0         # dBi
tx_height = 30.0       # m
beamwidth = 65.0       # degrees

rx_height = 1.5        # m
rx_loss = 3.0          # dB, body loss
margin = 6.0           # dB
model = "auto"         # 3GPP UMa above 2 GHz
environment = "urban"

# 100 MHz channel, noise figure 7 dB, minimum SNR -3 dB
bandwidth = 100.0
noise_figure = 7.0
snr = -3.0

radius = 1.0           # km around the sites
resolution = 25.0      # m

