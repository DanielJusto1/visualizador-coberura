# 5G NR n78 (3.5 GHz) from a rooftop site at Torrespaña to a smartphone
# inside a building at Puerta del Sol, Madrid.
band = "n78"
tx_lat = 40.4233       # transmitter: Torrespaña
tx_lon = -3.6714
rx_lat = 40.4169       # receiver: Puerta del Sol
rx_lon = -3.7035

tx_power = 43.0        # dBm (20 W)
tx_gain = 24.0         # dBi, massive MIMO beamforming gain
tx_loss = 0.0          # dB, active antenna, no feeder
rx_gain = 0.0          # dBi
rx_loss = 3.0          # dB, body loss
other_losses = 20.0    # dB, building penetration
margin = 8.0           # dB

sensitivity = -95.0    # dBm
